<form class="survey-form" [formGroup]="surveyForm" (ngSubmit)="handleSubmit()">
  <section class="survey-form__card" aria-labelledby="details-heading">
    <h2 id="details-heading" class="survey-form__card-title">Details</h2>

    <div class="survey-form__field survey-form__field--name">
      <label for="survey-title" class="survey-form__label">Survey name</label>
      <input
        id="survey-title"
        type="text"
        class="input-field"
        placeholder="e.g. Team event 2026"
        formControlName="title"
      />
      <span
        class="survey-form__error"
        [class.survey-form__error--visible]="surveyForm.controls.title.invalid && surveyForm.controls.title.touched"
      >
        Please enter a survey name
      </span>
    </div>

    <div class="survey-form__field survey-form__field--category">
      <span class="survey-form__label">Category</span>
      <app-dropdown
        placeholder="Choose category"
        [options]="categoryOptions"
        [selected]="surveyForm.controls.category.value"
        [invalid]="surveyForm.controls.category.invalid && surveyForm.controls.category.touched"
        (selectedChange)="surveyForm.controls.category.setValue($event)"
      />
      <span
        class="survey-form__error"
        [class.survey-form__error--visible]="surveyForm.controls.category.invalid && surveyForm.controls.category.touched"
      >
        Please select a category
      </span>
    </div>

    <div class="survey-form__field survey-form__field--enddate">
      <label for="survey-deadline" class="survey-form__label">
        End date <span class="survey-form__optional">(optional)</span>
      </label>
      <input
        id="survey-deadline"
        type="date"
        class="input-field"
        formControlName="deadline"
        [min]="today"
      />
      <span
        class="survey-form__error"
        [class.survey-form__error--visible]="surveyForm.controls.deadline.invalid && surveyForm.controls.deadline.touched"
      >
        Please choose a date in the future
      </span>
    </div>

    <div class="survey-form__field survey-form__field--describing">
      <label for="survey-description" class="survey-form__label">
        Description <span class="survey-form__optional">(optional)</span>
      </label>
      <textarea
        id="survey-description"
        class="textarea-field"
        placeholder="What is this survey about?"
        formControlName="description"
      ></textarea>
    </div>
  </section>

  <div class="survey-form__questions">
    @for (questionGroup of surveyForm.controls.questions.controls; track
    questionGroup; let questionIndex = $index) {
    <app-create-question
      [questionGroup]="questionGroup"
      [questionIndex]="questionIndex"
      (remove)="removeQuestion(questionIndex)"
    />
    }

    <app-button
      variant="dashed"
      class="survey-form__add-question"
      (click)="addQuestion()"
    >
      <app-plus-icon />
      Add next question
    </app-button>
  </div>

  <app-button variant="primary" class="survey-form__publish" type="submit">
    Publish
  </app-button>
</form>
