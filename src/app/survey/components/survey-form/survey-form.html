<form class="survey-form" [formGroup]="surveyForm" (ngSubmit)="handleSubmit()">
  <div class="survey-form__card">
    <div class="survey-form__field survey-form__field--name">
      <div class="survey-form__field-header">
        <span class="survey-form__label">Survey name</span>
        <app-button variant="icon" class="delete-btn" (click)="clearTitle()">
          <app-delete-icon />
        </app-button>
      </div>
      <input
        type="text"
        class="input-field"
        placeholder=""
        formControlName="title"
      />
      <span
        class="survey-form__error"
        [class.survey-form__error--visible]="surveyForm.controls.title.invalid && surveyForm.controls.title.touched"
      >
        Please enter a survey name
      </span>
    </div>

    <div class="survey-form__field survey-form__field--category">
      <app-dropdown
        label="Choose category"
        [options]="categoryOptions"
        [selected]="surveyForm.controls.category.value"
        (selectedChange)="surveyForm.controls.category.setValue($event)"
      />
      <span
        class="survey-form__error"
        [class.survey-form__error--visible]="surveyForm.controls.category.invalid && surveyForm.controls.category.touched"
      >
        Please select a category
      </span>
    </div>

    <div class="survey-form__field survey-form__field--enddate">
      <div class="survey-form__field-header">
        <span class="survey-form__label">End date - optional</span>
        <app-button variant="icon" class="delete-btn" (click)="clearDeadline()">
          <app-delete-icon />
        </app-button>
      </div>
      <input
        type="date"
        class="input-field"
        formControlName="deadline"
        [min]="today"
      />
      <span
        class="survey-form__error"
        [class.survey-form__error--visible]="surveyForm.controls.deadline.invalid && surveyForm.controls.deadline.touched"
      >
        Please choose a date in the future
      </span>
    </div>

    <div class="survey-form__field survey-form__field--describing">
      <div class="survey-form__field-header">
        <span class="survey-form__label">Describing text - optional</span>
        <app-button
          variant="icon"
          class="delete-btn"
          (click)="clearDescription()"
        >
          <app-delete-icon />
        </app-button>
      </div>
      <textarea
        class="textarea-field"
        placeholder=""
        formControlName="description"
      ></textarea>
    </div>

    <div class="survey-form__questions">
      @for (questionGroup of surveyForm.controls.questions.controls; track
      questionGroup; let questionIndex = $index) {
      <app-create-question
        [questionGroup]="questionGroup"
        [questionIndex]="questionIndex"
        (remove)="removeQuestion(questionIndex)"
      />
      }

      <app-button
        variant="neutral"
        class="survey-form__add-question"
        (click)="addQuestion()"
      >
        Add next question
        <app-plus-icon />
      </app-button>
    </div>
  </div>

  <app-button variant="primary" class="survey-form__publish" type="submit">
    Publish
    <svg
      width="18"
      height="16"
      viewBox="0 0 18 16"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M6.1556 12.5078L16.0211 0.427617C16.2539 0.142539 16.5255 0 16.8359 0C17.1463 0 17.418 0.142539 17.6508 0.427617C17.8836 0.712695 18 1.05122 18 1.44321C18 1.83519 17.8836 2.17372 17.6508 2.4588L6.97045 15.5724C6.73763 15.8575 6.46602 16 6.1556 16C5.84518 16 5.57356 15.8575 5.34075 15.5724L0.335252 9.44321C0.102438 9.15813 -0.00911854 8.8196 0.000582034 8.42762C0.0102826 8.03563 0.13154 7.6971 0.364354 7.41203C0.597167 7.12695 0.873634 6.98441 1.19375 6.98441C1.51387 6.98441 1.79034 7.12695 2.02315 7.41203L6.1556 12.5078Z"
        fill="#35273A"
      />
    </svg>
  </app-button>
</form>
