<div class="create-answer">
  <div class="create-answer__header">
    <span class="create-answer__letter">{{ answerLetter() }}</span>
    <app-button variant="icon" (click)="remove.emit()">
      <span class="create-answer__hidden-label">Delete answer</span>
      <app-delete-icon />
    </app-button>
  </div>
  <input
    type="text"
    class="input-field"
    placeholder=""
    [attr.aria-label]="'Answer ' + answerLetter()"
    [formControl]="answerControl()"
  />
  <span
    class="create-answer__error"
    [class.create-answer__error--visible]="answerControl().invalid && answerControl().touched"
  >
    Please enter an answer
  </span>
</div>
