<div class="hero-illustration" aria-hidden="true">
  <!-- Survey card (back) -->
  <svg
    class="hero-illustration__card hero-illustration__card--survey"
    viewBox="0 0 380 420"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <filter id="card-shadow-survey" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#4A2818" flood-opacity="0.18" />
      </filter>
    </defs>
    <g transform="translate(40 30)">
      <rect width="300" height="340" rx="22" fill="#B4532A" filter="url(#card-shadow-survey)" />
      <text x="28" y="44" font-size="11" font-weight="700" letter-spacing="1.76" fill="#FFFDF9" fill-opacity="0.85">TEAM ACTIVITIES</text>
      <text class="hero-illustration__heading" font-size="30" font-weight="600" fill="#FFFDF9">
        <tspan x="28" y="148">Let's plan the</tspan>
        <tspan x="28" y="181">next team event</tspan>
        <tspan x="28" y="214">together</tspan>
      </text>
      <rect x="28" y="282" width="122" height="30" rx="15" fill="#FFFDF9" fill-opacity="0.18" />
      <g transform="translate(40 290) scale(0.5833)" fill="none" stroke="#FFFDF9" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </g>
      <text x="60" y="302" font-size="13" font-weight="600" fill="#FFFDF9">Ends in 1 day</text>
    </g>
  </svg>

  <!-- Results card (front) -->
  <svg
    class="hero-illustration__card hero-illustration__card--results"
    viewBox="0 0 400 340"
    xmlns="http://www.w3.org/2000/svg"

      <filter id="card-shadow-results" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#4A2818" flood-opacity="0.16" />
      </filter>
    </defs>
    <g transform="translate(40 30)">
      <rect width="320" height="256" rx="22" fill="#FFFDF9" stroke="#E6DCD2" filter="url(#card-shadow-results)" />
      <text x="26" y="42" font-size="11" font-weight="700" letter-spacing="1.76" fill="#6E5D55">RESULTS</text>
      <rect x="236" y="28" width="58" height="20" rx="10" fill="#F6D9D3" />
      <circle cx="248" cy="38" r="3" fill="#C2412F" />
      <text x="256" y="42" font-size="11" font-weight="700" letter-spacing="1.1" fill="#8E2620">LIVE</text>
      <text font-size="17" font-weight="700" fill="#2A1D18">
        <tspan x="26" y="82">Which date would work best</tspan>
        <tspan x="26" y="104">for you?</tspan>
      </text>

      <text x="26" y="136.5" font-size="13" font-weight="700" fill="#6E5D55">A</text>
      <rect x="54" y="127" width="190" height="10" rx="5" fill="#EFE6DC" />
      <rect x="54" y="127" width="70.3" height="10" rx="5" fill="#D9A68C" />
      <text x="294" y="136.5" text-anchor="end" font-size="13" font-weight="600" fill="#2A1D18">37%</text>

      <text x="26" y="164.5" font-size="13" font-weight="700" fill="#6E5D55">B</text>
      <rect x="54" y="155" width="190" height="10" rx="5" fill="#EFE6DC" />
      <rect x="54" y="155" width="83.6" height="10" rx="5" fill="#B4532A" />
      <text x="294" y="164.5" text-anchor="end" font-size="13" font-weight="600" fill="#2A1D18">44%</text>

      <text x="26" y="192.5" font-size="13" font-weight="700" fill="#6E5D55">C</text>
      <rect x="54" y="183" width="190" height="10" rx="5" fill="#EFE6DC" />
      <rect x="54" y="183" width="5.7" height="10" rx="5" fill="#D9A68C" />
      <text x="294" y="192.5" text-anchor="end" font-size="13" font-weight="600" fill="#2A1D18">3%</text>

      <text x="26" y="220.5" font-size="13" font-weight="700" fill="#6E5D55">D</text>
      <rect x="54" y="211" width="190" height="10" rx="5" fill="#EFE6DC" />
      <rect x="54" y="211" width="49.4" height="10" rx="5" fill="#D9A68C" />
      <text x="294" y="220.5" text-anchor="end" font-size="13" font-weight="600" fill="#2A1D18">26%</text>
    </g>
  </svg>
</div>
