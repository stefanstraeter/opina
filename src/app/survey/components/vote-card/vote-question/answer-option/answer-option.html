<label
  class="answer-option"
  [class.answer-option--selected]="selected()"
  [class.answer-option--locked]="locked()"
>
  <app-checkbox
    [checked]="selected()"
    [disabled]="locked()"
    (toggled)="toggled.emit()"
  />
  <span>
    <strong class="answer-option__letter">{{ answerLetter() }}.</strong>
    {{ text() }}
  </span>
</label>
