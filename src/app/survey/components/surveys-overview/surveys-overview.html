<section id="surveys" class="surveys-overview">
  <header class="surveys-overview__header">
    <h2 class="surveys-overview__title">Your surveys</h2>
    <h3 class="surveys-overview__subtitle">Ending soon</h3>
  </header>

  <div
    class="surveys-overview__highlight-row"
    (scroll)="updateActiveCard($event)"
  >
    @for (survey of endingSoonSurveys(); track survey.id; let position = $index)
    {
    <app-survey-card
      [id]="survey.id"
      variant="highlight"
      [number]="position + 1"
      [category]="survey.category"
      [title]="survey.title"
      [deadline]="survey.deadline"
    />
    }
  </div>

  <app-pagination-dots
    class="surveys-overview__dots"
    [count]="endingSoonSurveys().length"
    [activeIndex]="activeCardIndex()"
  />

  <div class="surveys-overview__controls">
    <div class="surveys-overview__filters">
      <app-button
        variant="filter"
        [active]="activeFilter() === 'active'"
        (click)="setFilter('active')"
      >
        Active
      </app-button>
      <app-button
        variant="filter"
        [active]="activeFilter() === 'ended'"
        (click)="setFilter('ended')"
      >
        Past
      </app-button>
    </div>

    <div class="surveys-overview__sort">
      <span class="surveys-overview__sort-label">Sort by</span>
      <app-dropdown
        placeholder="Choose category"
        [options]="categoryOptions"
        [selected]="selectedCategory()"
        (selectedChange)="selectedCategory.set($event)"
      />
    </div>
  </div>
  <div class="surveys-overview__list-area">
    <div class="surveys-overview__list">
      @for (survey of filteredSurveys(); track survey.id) {
      <app-survey-card
        [id]="survey.id"
        variant="list"
        [category]="survey.category"
        [title]="survey.title"
        [deadline]="survey.deadline"
      />
      } @empty {
      <p class="surveys-overview__empty">No surveys found for this category.</p>
      }
    </div>
  </div>
</section>
