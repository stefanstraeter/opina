<header class="app-header" [class.is-dark]="!isLightMode()">
  <div class="header-container">
    <a routerLink="/" class="logo" aria-label="Opina, navigate to home page">
      <img src="img/opina-logo.svg" alt="" class="logo__icon" />
      <span class="logo__text">Opina</span>
    </a>
    @if (showCreateSurveyButton()) {
    <app-button
      class="create-button create-button--round"
      variant="secondary"
      size="round"
      routerLink="/create-survey"
    >
      <app-plus-icon />
      <span class="create-button__label">Create survey</span>
    </app-button>
    <app-button
      class="create-button create-button--pill"
      variant="secondary"
      routerLink="/create-survey"
    >
      <app-plus-icon />
      Create survey
    </app-button>
    }
  </div>
</header>
