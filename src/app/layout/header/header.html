<header class="app-header" [class.is-dark]="!isLightMode()">
  <div class="header-container">
    <a routerLink="/" class="logo" aria-label="navigate to home page">
      <img
        [src]="isLightMode() ? 'img/logo-dark.svg' : 'img/logo-orange.svg'"
        alt="Poll App Logo"
      />
    </a>
    @if (showCreateSurveyButton()) {
    <app-button
      class="create-button"
      variant="primary"
      routerLink="/create-survey"
      >Create survey</app-button
    >
    }
  </div>
</header>
